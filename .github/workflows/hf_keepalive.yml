name: HuggingFace KeepAlive

on:
  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:
    inputs:
      skip_sleep:
        description: "Skip random sleep"
        required: false
        default: "true"

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Random Sleep
        shell: bash
        run: |
          SKIP=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SKIP="${{ github.event.inputs.skip_sleep }}"
          fi

          if [ "$SKIP" = "true" ]; then
            echo "Skip sleep."
            exit 0
          fi

          DELAY=$((RANDOM % 14400))
          echo "Sleep ${DELAY}s"
          sleep "$DELAY"

      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/install.sh | sudo bash

      - name: Generate config
        env:
          HY2_URL: ${{ secrets.HY2_URL }}
        shell: bash
        run: |

          URL="${HY2_URL#hysteria2://}"

          PASSWORD="${URL%@*}"
          REST="${URL#*@}"

          SERVERPORT="${REST%%\?*}"
          SERVER="${SERVERPORT%%:*}"
          PORT="${SERVERPORT##*:}"

          cat > config.json <<EOF
          {
            "log": {
              "level": "warn"
            },
            "inbounds": [
              {
                "type": "socks",
                "listen": "127.0.0.1",
                "listen_port": 1080
              }
            ],
            "outbounds": [
              {
                "type": "hysteria2",
                "server": "${SERVER}",
                "server_port": ${PORT},
                "password": "${PASSWORD}",
                "tls": {
                  "enabled": true,
                  "insecure": true
                }
              }
            ]
          }
          EOF

      - name: Start sing-box
        run: |
          sudo sing-box run -c config.json &
          sleep 5

      - name: Test Proxy
        run: |
          export ALL_PROXY=socks5://127.0.0.1:1080
          curl -I https://huggingface.co --max-time 20

      - name: Check HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |

          export ALL_PROXY=socks5://127.0.0.1:1080

          RESULT=$(curl -fsS \
            --max-time 30 \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/spaces/aliliyou/cto)

          echo "$RESULT"

          STAGE=$(echo "$RESULT" | python3 -c '
import sys,json
try:
    d=json.load(sys.stdin)
    print(d.get("runtime",{}).get("stage")
          or d.get("stage")
          or "unknown")
except:
    print("unknown")
')

          echo "Stage: $STAGE"

          if [ "$STAGE" = "RUNNING" ] || [ "$STAGE" = "RUNNING_BUILDING" ]; then
            echo "✅ Space running"
          else
            echo "⚠️ Space stage=$STAGE"
          fi
