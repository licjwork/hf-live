name: HuggingFace Keepalive

on:
  schedule:
    - cron: '0 */4 * * *'   # 每4小时整点触发，再配合随机 sleep 会变成不规则间隔
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Random sleep between 0 and 4 hours
        run: |
          MAX_SLEEP=$((RANDOM % 14400))   # 0 ~ 4 小时随机秒数
          echo "Sleeping $MAX_SLEEP seconds to randomize interval"
          sleep $MAX_SLEEP

      - name: Ping HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          RESULT=$(curl -s --max-time 30 \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/aliliyou/cto")
          echo "API response: $RESULT"
          STAGE=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('runtime',{}).get('stage') or d.get('stage') or 'unknown')" 2>/dev/null || echo "unknown")
          echo "Space stage: $STAGE"
          if [ "$STAGE" = "RUNNING" ] || [ "$STAGE" = "RUNNING_BUILDING" ]; then
            echo "✅ Space is running"
          else
            echo "⚠️  Space stage=$STAGE"
          fi
