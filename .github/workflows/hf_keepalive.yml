name: HuggingFace Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          RESULT=$(curl -s --max-time 30 \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/aliliyou/cto")
          echo "API response: $RESULT"
          STAGE=$(echo "$RESULT" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    # 尝试多个路径
    stage = d.get('runtime', {}).get('stage') or d.get('stage') or 'unknown'
    print(stage)
except Exception as e:
    print('parse_error:' + str(e))
" 2>/dev/null || echo "unknown")
          echo "Space stage: $STAGE"
          if [ "$STAGE" = "RUNNING" ] || [ "$STAGE" = "RUNNING_BUILDING" ]; then
            echo "✅ Space is running"
          else
            echo "⚠️  Space stage=$STAGE"
          fi
