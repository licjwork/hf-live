name: HuggingFace Keepalive with Hysteria2

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      skip_sleep:
        description: 'Skip random sleep'
        required: false
        default: true
        type: boolean

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Random sleep
        if: ${{ !github.event.inputs.skip_sleep }}
        run: sleep $((RANDOM % 14400))

      - name: Install sing-box
        run: |
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.12.9/sing-box-1.12.9-linux-amd64.tar.gz
          tar -xzf sing-box-*.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/
          sing-box version

      - name: Create config
        run: |
          cat > config.json << 'EOF'
          {
            "inbounds": [
              {
                "type": "http",
                "listen": "127.0.0.1",
                "listen_port": 8080
              }
            ],
            "outbounds": [
              {
                "type": "hysteria2",
                "server": "YOUR_SERVER_HERE",
                "server_port": 443,
                "password": "YOUR_PASSWORD_HERE",
                "tls": {
                  "insecure": true
                }
              }
            ]
          }
          EOF
          
          # 替换变量（用 sed 更安全）
          sed -i "s/YOUR_SERVER_HERE/${{ secrets.HY2_SERVER }}/g" config.json
          sed -i "s/YOUR_PASSWORD_HERE/${{ secrets.HY2_PASSWORD }}/g" config.json
          sed -i "s/443/${{ secrets.HY2_PORT }}/g" config.json
          
          echo "=== Generated config ==="
          cat config.json
          echo ""
          echo "=== Validating JSON ==="
          python3 -m json.tool config.json > /dev/null 2>&1 && echo "✓ JSON valid" || echo "✗ JSON invalid"

      - name: Start proxy
        run: |
          sudo /usr/local/bin/sing-box run -c config.json > sing-box.log 2>&1 &
          sleep 5
          cat sing-box.log || true

      - name: Test proxy
        run: |
          echo "Testing proxy..."
          curl -v --max-time 10 --proxy http://127.0.0.1:8080 https://ip.sb 2>&1 || true

      - name: Ping HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -s --max-time 30 \
            --proxy http://127.0.0.1:8080 \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/aliliyou/cto" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('Stage:', d.get('runtime',{}).get('stage') or d.get('stage', 'unknown'))"
