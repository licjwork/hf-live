name: HuggingFace KeepAlive

on:
  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:
    inputs:
      skip_sleep:
        description: "Skip random sleep"
        required: false
        default: "true"

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. 随机 sleep（可跳过）
      # =========================
      - name: Random Sleep
        shell: bash
        run: |
          SKIP="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SKIP="${{ github.event.inputs.skip_sleep }}"
          fi

          if [ "$SKIP" = "true" ]; then
            echo "Skip sleep."
          else
            DELAY=$((RANDOM % 14400))
            echo "Sleep ${DELAY}s"
            sleep "$DELAY"
          fi

      # =========================
      # 2. 安装 sing-box
      # =========================
      - name: Install sing-box
        shell: bash
        run: |
          curl -fsSL https://sing-box.app/install.sh | bash

      # =========================
      # 3. 解析 HY2_URL -> config.json
      # =========================
      - name: Generate sing-box config
        shell: bash
        env:
          HY2_URL: ${{ secrets.HY2_URL }}
        run: |
          echo "Parsing HY2_URL..."

          URL="${HY2_URL#hysteria2://}"

          PASSWORD="${URL%@*}"
          HOSTPORT="${URL#*@}"
          HOSTPORT="${HOSTPORT%%\?*}"

          HOST="${HOSTPORT%%:*}"
          PORT="${HOSTPORT##*:}"

          echo "server=$HOST"
          echo "port=$PORT"

          cat > config.json <<EOF
          {
            "log": {
              "level": "warn"
            },
            "inbounds": [
              {
                "type": "socks",
                "listen": "127.0.0.1",
                "listen_port": 1080
              }
            ],
            "outbounds": [
              {
                "type": "hysteria2",
                "server": "${HOST}",
                "server_port": ${PORT},
                "password": "${PASSWORD}",
                "tls": {
                  "enabled": true,
                  "insecure": true
                }
              }
            ]
          }
          EOF

          echo "Config generated."

      # =========================
      # 4. 启动 sing-box
      # =========================
      - name: Start sing-box
        shell: bash
        run: |
          nohup sing-box run -c config.json > sb.log 2>&1 &
          sleep 5

      # =========================
      # 5. 测试代理是否可用
      # =========================
      - name: Test Proxy
        shell: bash
        run: |
          curl -I https://huggingface.co \
            --max-time 20 \
            --proxy socks5://127.0.0.1:1080 || true

      # =========================
      # 6. 请求 HuggingFace Space
      # =========================
      - name: Check HuggingFace Space
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          export ALL_PROXY=socks5://127.0.0.1:1080

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://aliliyou-cto.hf.space)

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "301" ]; then
            echo "✅ Space is running (HTTP $STATUS)"
          else
            echo "⚠️ Space returned HTTP $STATUS"
          fi

      # =========================
      # 7. 检查账号列表，为空则添加
      # =========================
      - name: Ensure accounts exist
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ACCOUNTS: ${{ secrets.HF_ACCOUNTS }}
        run: |
          export ALL_PROXY=socks5://127.0.0.1:1080

          PAGE=$(curl -s --max-time 30 \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://aliliyou-cto.hf.space)

          # 检查 OTP 下拉框中是否有 option（有账号时才会有）
          ACCOUNT_COUNT=$(echo "$PAGE" | grep -c '<option' || true)
          if [ "$ACCOUNT_COUNT" -eq 0 ]; then
            echo "⚠️ 账号列表为空，开始添加账号..."

            ITEMS=$(echo "$HF_ACCOUNTS" | jq -c '.[]')
            while IFS= read -r ACCOUNT; do
              LABEL=$(echo "$ACCOUNT" | jq -r '.label')
              BIZ_ID=$(echo "$ACCOUNT" | jq -r '.business_id')
              USERNAME=$(echo "$ACCOUNT" | jq -r '.github_username')
              PASSWORD=$(echo "$ACCOUNT" | jq -r '.github_password')
              ACTIVE_START=$(echo "$ACCOUNT" | jq -r '.active_start')
              ACTIVE_END=$(echo "$ACCOUNT" | jq -r '.active_end')

              echo "Adding account: $LABEL"

              curl -s -X POST --max-time 30 \
                -H "Authorization: Bearer $HF_TOKEN" \
                -d "label=${LABEL}&business_id=${BIZ_ID}&github_username=${USERNAME}&github_password=${PASSWORD}&active_start=${ACTIVE_START}&active_end=${ACTIVE_END}" \
                https://aliliyou-cto.hf.space/account/add || true

              echo "✅ Added: $LABEL"
            done <<< "$ITEMS"
          else
            echo "✅ 账号列表已有数据 (${ACCOUNT_COUNT} accounts)，跳过添加"
          fi
