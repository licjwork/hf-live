name: HuggingFace Keepalive with Hysteria2

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      skip_sleep:
        description: 'Skip random sleep'
        required: false
        default: true
        type: boolean

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Random sleep
        if: ${{ !github.event.inputs.skip_sleep }}
        run: sleep $((RANDOM % 14400))

      - name: Install sing-box
        run: |
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.12.9/sing-box-1.12.9-linux-amd64.tar.gz
          tar -xzf sing-box-*.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/
          sing-box version

      - name: Create config (clean version)
        run: |
          # 直接用 echo 逐行写入，避免 JSON 格式问题
          echo '{' > config.json
          echo '  "inbounds": [' >> config.json
          echo '    {' >> config.json
          echo '      "type": "http",' >> config.json
          echo '      "listen": "127.0.0.1",' >> config.json
          echo '      "listen_port": 8080' >> config.json
          echo '    }' >> config.json
          echo '  ],' >> config.json
          echo '  "outbounds": [' >> config.json
          echo '    {' >> config.json
          echo '      "type": "hysteria2",' >> config.json
          echo '      "server": "'${{ secrets.HY2_SERVER }}'",' >> config.json
          echo '      "server_port": '${{ secrets.HY2_PORT }}',' >> config.json
          echo '      "password": "'${{ secrets.HY2_PASSWORD }}'",' >> config.json
          echo '      "tls": {' >> config.json
          echo '        "insecure": true' >> config.json
          echo '      }' >> config.json
          echo '    }' >> config.json
          echo '  ]' >> config.json
          echo '}' >> config.json
          
          echo "=== Generated config ==="
          cat config.json
          echo ""
          echo "=== Validate JSON ==="
          python3 -m json.tool config.json > /dev/null && echo "✓ JSON is valid" || echo "✗ JSON is invalid"

      - name: Start sing-box
        run: |
          sudo /usr/local/bin/sing-box run -c config.json > sing-box.log 2>&1 &
          sleep 5
          
          echo "=== Sing-box process ==="
          ps aux | grep sing-box | grep -v grep || echo "Process not running"
          
          echo "=== Sing-box log ==="
          cat sing-box.log || echo "No log"

      - name: Test proxy
        run: |
          echo "=== Testing proxy connection ==="
          curl -s --max-time 10 --proxy http://127.0.0.1:8080 https://ip.sb && echo "✓ Proxy works" || echo "✗ Proxy failed"

      - name: Ping HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "=== Calling HuggingFace API ==="
          curl -s --max-time 30 \
            --proxy http://127.0.0.1:8080 \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/aliliyou/cto" | \
            python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    stage = data.get('runtime', {}).get('stage') or data.get('stage', 'unknown')
    print(f'✅ Space stage: {stage}')
    if stage in ['RUNNING', 'RUNNING_BUILDING']:
        print('✅ Keepalive successful')
    else:
        print(f'⚠️ Stage is {stage}')
except Exception as e:
    print(f'❌ Error: {e}')
    sys.exit(1)
"
