name: HuggingFace KeepAlive

on:
  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:
    inputs:
      skip_sleep:
        description: "Skip random sleep"
        required: false
        default: "true"

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. 随机 sleep（可跳过）
      # =========================
      - name: Random Sleep
        shell: bash
        run: |
          SKIP="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SKIP="${{ github.event.inputs.skip_sleep }}"
          fi

          if [ "$SKIP" = "true" ]; then
            echo "Skip sleep."
          else
            DELAY=$((RANDOM % 14400))
            echo "Sleep ${DELAY}s"
            sleep "$DELAY"
          fi

      # =========================
      # 2. 安装 sing-box
      # =========================
      - name: Install sing-box
        shell: bash
        run: |
          curl -fsSL https://sing-box.app/install.sh | bash

      # =========================
      # 3. 解析 HY2_URL -> config.json
      # =========================
      - name: Generate sing-box config
        shell: bash
        env:
          HY2_URL: ${{ secrets.HY2_URL }}
        run: |
          echo "Parsing HY2_URL..."

          URL="${HY2_URL#hysteria2://}"

          PASSWORD="${URL%@*}"
          HOSTPORT="${URL#*@}"
          HOSTPORT="${HOSTPORT%%\?*}"

          HOST="${HOSTPORT%%:*}"
          PORT="${HOSTPORT##*:}"

          echo "server=$HOST"
          echo "port=$PORT"

          cat > config.json <<EOF
          {
            "log": {
              "level": "warn"
            },
            "inbounds": [
              {
                "type": "socks",
                "listen": "127.0.0.1",
                "listen_port": 1080
              }
            ],
            "outbounds": [
              {
                "type": "hysteria2",
                "server": "${HOST}",
                "server_port": ${PORT},
                "password": "${PASSWORD}",
                "tls": {
                  "enabled": true,
                  "insecure": true
                }
              }
            ]
          }
          EOF

          echo "Config generated."

      # =========================
      # 4. 启动 sing-box
      # =========================
      - name: Start sing-box
        shell: bash
        run: |
          nohup sing-box run -c config.json > sb.log 2>&1 &
          sleep 5

      # =========================
      # 5. 测试代理是否可用
      # =========================
      - name: Test Proxy
        shell: bash
        run: |
          curl -I https://huggingface.co \
            --max-time 20 \
            --proxy socks5://127.0.0.1:1080 || true

      # =========================
      # 6. 请求 HuggingFace Space
      # =========================
      - name: Check HuggingFace Space
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          export ALL_PROXY=socks5://127.0.0.1:1080

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://aliliyou-cto.hf.space)

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "301" ]; then
            echo "✅ Space is running (HTTP $STATUS)"
          else
            echo "⚠️ Space returned HTTP $STATUS"
          fi
