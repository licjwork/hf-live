name: HuggingFace Keepalive

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      skip_sleep:
        description: 'Skip random sleep'
        required: false
        default: true
        type: boolean

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Random sleep
        if: ${{ !github.event.inputs.skip_sleep }}
        run: sleep $((RANDOM % 14400))

      - name: Install sing-box
        run: |
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.12.9/sing-box-1.12.9-linux-amd64.tar.gz
          tar -xzf sing-box-*.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/

      - name: Create config
        run: |
          cat > config.json << 'EOF'
          {
            "inbounds": [
              {
                "type": "http",
                "listen": "127.0.0.1",
                "listen_port": 8080
              }
            ],
            "outbounds": [
              {
                "type": "hysteria2",
                "server": "${{ secrets.HY2_SERVER }}",
                "server_port": ${{ secrets.HY2_PORT }},
                "password": "${{ secrets.HY2_PASSWORD }}",
                "tls": {
                  "insecure": true
                }
              }
            ]
          }
          EOF
          cat config.json

      - name: Start proxy
        run: |
          sudo sing-box run -c config.json &
          sleep 8

      - name: Keepalive
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -s --proxy http://127.0.0.1:8080 \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/aliliyou/cto" | \
            grep -q "RUNNING" && echo "✅ Success" || echo "⚠️ Check"
