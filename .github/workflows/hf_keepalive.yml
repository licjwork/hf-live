name: HuggingFace Keepalive with Hysteria2

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      skip_sleep:
        description: 'Skip random sleep'
        required: false
        default: true
        type: boolean

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Random sleep
        if: ${{ !github.event.inputs.skip_sleep }}
        run: sleep $((RANDOM % 14400))

      - name: Install sing-box
        run: |
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.12.9/sing-box-1.12.9-linux-amd64.tar.gz
          tar -xzf sing-box-*.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/
          sing-box version

      - name: Create config
        run: |
          cat > config.json << EOF
          {
            "inbounds": [
              {
                "type": "http",
                "listen": "127.0.0.1",
                "listen_port": 8080
              }
            ],
            "outbounds": [
              {
                "type": "hysteria2",
                "server": "${{ secrets.HY2_SERVER }}",
                "server_port": ${{ secrets.HY2_PORT }},
                "password": "${{ secrets.HY2_PASSWORD }}",
                "tls": {
                  "insecure": true
                }
              }
            ]
          }
          EOF
          
          echo "=== Config content ==="
          cat config.json
          echo ""
          echo "=== Validate JSON ==="
          cat config.json | python3 -m json.tool > /dev/null 2>&1 && echo "✓ JSON valid" || echo "✗ JSON invalid"

      - name: Start sing-box
        run: |
          sudo /usr/local/bin/sing-box run -c config.json 2>&1 | tee sing-box.log &
          SB_PID=$!
          echo "Sing-box PID: $SB_PID"
          sleep 5
          
          echo "=== Sing-box process ==="
          ps aux | grep sing-box | grep -v grep
          
          echo "=== Sing-box log (first 20 lines) ==="
          head -20 sing-box.log 2>/dev/null || echo "No log yet"

      - name: Test proxy connectivity
        run: |
          echo "=== Test 1: Direct connection (no proxy) ==="
          curl -s --max-time 5 https://ip.sb || echo "Direct connection failed"
          
          echo ""
          echo "=== Test 2: Through proxy ==="
          curl -v --max-time 10 --proxy http://127.0.0.1:8080 https://ip.sb 2>&1
          
          echo ""
          echo "=== Test 3: Check proxy port ==="
          netstat -tlnp 2>/dev/null | grep 8080 || ss -tlnp | grep 8080 || echo "Port 8080 not listening"

      - name: Ping HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "=== Calling HuggingFace API ==="
          RESPONSE=$(curl -v --max-time 30 \
            --proxy http://127.0.0.1:8080 \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/aliliyou/cto" 2>&1)
          
          CURL_EXIT=$?
          echo "Curl exit code: $CURL_EXIT"
          echo ""
          echo "=== Response (first 500 chars) ==="
          echo "$RESPONSE" | head -c 500
          echo ""
          
          if [ $CURL_EXIT -eq 0 ]; then
            echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Stage:', d.get('runtime',{}).get('stage') or d.get('stage', 'unknown'))" 2>&1
          else
            echo "❌ API call failed"
          fi

      - name: Show full log on failure
        if: failure()
        run: |
          echo "=== Full sing-box log ==="
          cat sing-box.log 2>/dev/null || echo "No log file"
