name: HuggingFace Keepalive

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      skip_sleep:
        description: 'Skip random sleep'
        required: false
        default: false
        type: boolean

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Random sleep between 0 and 4 hours
        if: ${{ !github.event.inputs.skip_sleep }}
        run: |
          MAX_SLEEP=$((RANDOM % 14400))
          echo "Sleeping $MAX_SLEEP seconds to randomize interval"
          sleep $MAX_SLEEP

      - name: Install hysteria2
        run: |
          wget -q https://github.com/apernet/hysteria/releases/download/app/v2.6.1/hysteria-linux-amd64
          chmod +x hysteria-linux-amd64
          sudo mv hysteria-linux-amd64 /usr/local/bin/hysteria

      - name: Start hysteria2 proxy
        env:
          HY2_URL: ${{ secrets.HY2_URL }}
        run: |
          # 解析 HY2 URL
          SERVER=$(echo "$HY2_URL" | sed -E 's#hy2://([^:/?]+).*#\1#')
          PORT=$(echo "$HY2_URL" | grep -oP ':\d+' | head -1 | cut -d':' -f2)
          PORT=${PORT:-443}
          AUTH=$(echo "$HY2_URL" | grep -oP 'auth=\K[^&]+')
          
          # 启动代理
          sudo hysteria client \
            --server "${SERVER}:${PORT}" \
            --auth "$AUTH" \
            --tls-insecure \
            --http "127.0.0.1:8080" \
            > /dev/null 2>&1 &
          
          sleep 8

      - name: Ping HuggingFace Space via Proxy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          RESULT=$(curl -s --max-time 30 \
            --proxy http://127.0.0.1:8080 \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/aliliyou/cto")
          
          echo "API response: $RESULT"
          STAGE=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('runtime',{}).get('stage') or d.get('stage') or 'unknown')" 2>/dev/null || echo "unknown")
          echo "Space stage: $STAGE"
          
          if [ "$STAGE" = "RUNNING" ] || [ "$STAGE" = "RUNNING_BUILDING" ]; then
            echo "✅ Space is running"
          else
            echo "⚠️  Space stage=$STAGE"
          fi
