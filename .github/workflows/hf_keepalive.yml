name: HuggingFace Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 查询 space 状态
          RESULT=$(curl -s --max-time 30 \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/aliliyou/cto")
          STAGE=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('runtime',{}).get('stage','unknown'))" 2>/dev/null || echo "unknown")
          echo "Space stage: $STAGE"

          # 直接访问 space 触发唤醒
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://aliliyou-cto.hf.space/")
          echo "HTTP Status: $STATUS"

          if [ "$STAGE" = "RUNNING" ]; then
            echo "✅ Space is running"
          else
            echo "⚠️  Space stage=$STAGE, HTTP=$STATUS"
          fi
